[project]
name = "truelift"
version = "2.0.0"
description = "Forecast, target and measure restaurant discounts by the extra orders and profit they create."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Team Banana, IIT Gandhinagar" }]
# Lower bounds only; uv.lock (and requirements.txt exported from it) pins the exact versions.
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5,<1.8",
  "scipy>=1.11",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "schemathesis>=3.30",
  "locust>=2.29",
  "pre-commit>=3.7",
]
media = [
  "imageio-ffmpeg>=0.5",
  "qrcode>=7.4",
  "pillow>=10",
  "python-pptx>=1.0",
]

[tool.uv]
package = false
default-groups = ["dev"]
# The audit re-ran the full pipeline with exactly these versions and reproduced the committed
# results to the last digit (plan E-02), so the lock pins them.
constraint-dependencies = [
  "numpy==2.2.6",
  "pandas==3.0.5",
  "scikit-learn==1.5.2",
  "scipy==1.14.1",
  "fastapi==0.139.2",
  "pydantic==2.9.2",
  "httpx==0.27.2",
  "uvicorn==0.51.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "slow: statistical, golden and fuzz checks (minutes, not seconds)",
]
addopts = "-ra"
filterwarnings = [
  # third-party notice from starlette about its own test client; nothing in TrueLift to change
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["truelift"]
omit = ["truelift/static/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["plan", "site", "dist", "tests/ui/node_modules", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E731", "SIM108", "B008"]

[tool.pyright]
include = [
  "truelift/economics.py",
  "truelift/engine.py",
  "truelift/schemas.py",
  "truelift/assignment.py",
  "truelift/features.py",
]
typeCheckingMode = "basic"
pythonVersion = "3.11"

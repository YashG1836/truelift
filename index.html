<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrueLift prototype</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e23744'/%3E%3Cpath d='M9 21l5-6 4 3 6-8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<header class="top">
  <div class="brand">TrueLift <span>prototype</span></div>
  <nav>
    <button data-tab="demo" class="on">Demo</button>
    <button data-tab="evidence">Evidence</button>
    <button data-tab="money">Money maths</button>
  </nav>
  <div class="pick">
    <label for="rest">Restaurant</label>
    <select id="rest"></select>
  </div>
</header>

<main>
  <section id="tab-demo" class="tab on">
    <div class="demo">
      <div class="phone" aria-label="Restaurant partner app">
        <div class="phone-bar"><span>Restaurant Partner</span><span id="clock"></span></div>
        <div id="screen" class="screen"></div>
      </div>
      <aside class="inside">
        <h2>Inside Zomato</h2>
        <p class="muted">What happens behind the owner's screen. Customers are synthetic. Restaurants are real Bengaluru listings (locality, cuisine, rating, price) shown without their names, because their profits here are simulated.</p>
        <div id="who"></div>
        <div id="truth"></div>
        <div id="calls"></div>
      </aside>
    </div>
  </section>

  <section id="tab-evidence" class="tab"><div id="evidence" class="page"></div></section>
  <section id="tab-money" class="tab"><div id="money" class="page"></div></section>
</main>
<div id="tip" class="tip" role="tooltip"></div>
<script>window.TRUELIFT_STATIC = "data/";</script>
<script src="static/app.js"></script>
</body>
</html>

# Every number the documents state about the results, and where it comes from (audit A07 R1).
# `python scripts/check_claims.py` computes each `expr` from reports/ (ev = evaluation.json,
# criteo / hill = uplift_validation_*.json, pilot = pilot_sample_size.json, bench = learner_benchmark.json,
# sens = sensitivity.json, lat = latency.json,
# exp(name) = exp_<name>.json result, ex / pre = the money
# example with commission after / before the discount, from truelift/economics.py), formats it,
# and checks that every listed document contains `text` with the number in place of {}.
# Generated tables (render_tables.py markers) are checked by `render_tables.py --check` instead.

claims:
  # ---- the money of one order (truelift/economics.py)
  - {id: keeps_discounted, expr: "ex.per_order_discounted.restaurant_profit", format: inr2, text: "f = 1 − {} / ₹134", docs: [docs/method_and_evidence.md]}
  - {id: keeps_full, expr: "ex.per_order_full.restaurant_profit", format: inr, text: "₹91.70 / {} = 31.6%", docs: [docs/method_and_evidence.md]}
  - {id: break_even_15, expr: "1 - ex.per_order_discounted.restaurant_profit / ex.per_order_full.restaurant_profit", format: pct1, text: "/ ₹134 = {}", docs: [docs/method_and_evidence.md]}
  - {id: break_even_10, expr: "ex.break_even[0]['extra_share_needed']", format: pct0, text: "| 10% (₹40) | {} |", docs: [docs/method_and_evidence.md]}
  - {id: break_even_15_row, expr: "ex.break_even[1]['extra_share_needed']", format: pct0, text: "| 15% (₹60) | {} |", docs: [docs/method_and_evidence.md]}
  - {id: break_even_20, expr: "ex.break_even[2]['extra_share_needed']", format: pct0, text: "| 20% (₹80) | {} |", docs: [docs/method_and_evidence.md]}
  - {id: break_even_25, expr: "ex.break_even[3]['extra_share_needed']", format: pct0, text: "| 25% (₹100) | {} |", docs: [docs/method_and_evidence.md]}
  - {id: pre_discount_keeps, expr: "pre.per_order_discounted.restaurant_profit", format: inr, text: "off leaves {} and the break-even rises", docs: [docs/method_and_evidence.md]}
  - {id: pre_discount_break_even, expr: "1 - pre.per_order_discounted.restaurant_profit / pre.per_order_full.restaurant_profit", format: pct0, text: "the break-even rises to {}", docs: [docs/method_and_evidence.md]}
  - {id: pct_small_order, expr: "ex.pct_example.rows[0]['extra_share_needed']", format: pct0, text: "pays only if {} of the ₹150 orders using it are extra", docs: [docs/method_and_evidence.md]}
  - {id: pct_usual_order, expr: "ex.pct_example.rows[2]['extra_share_needed']", format: pct0, text: "against {} of the ₹400 ones", docs: [docs/method_and_evidence.md]}
  - {id: pct_large_order, expr: "ex.pct_example.rows[3]['extra_share_needed']", format: pct0, text: "and {} of the ₹600 ones", docs: [docs/method_and_evidence.md]}
  - {id: r1_blanket_restaurant, expr: "ex.blanket.restaurant_change", format: inr_signed, text: "the restaurant makes {} a week and Zomato's commission", docs: [docs/method_and_evidence.md]}
  - {id: r1_blanket_zomato, expr: "ex.blanket.zomato_change", format: inr, text: "Zomato's commission rises by {};", docs: [docs/method_and_evidence.md]}
  - {id: r1_blanket_spend, expr: "ex.blanket.discount_spend", format: inr, text: "{} of discounts buy 30 extra orders", docs: [docs/method_and_evidence.md]}
  - {id: r1_blanket_per_extra, expr: "ex.blanket.discount_per_extra_order", format: inr, text: "30 extra orders, {} per extra order", docs: [docs/method_and_evidence.md]}
  - {id: r1_truelift_restaurant, expr: "ex.truelift.restaurant_change", format: inr_signed, text: "the restaurant makes {} and Zomato", docs: [docs/method_and_evidence.md]}

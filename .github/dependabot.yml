# Weekly update proposals. Dependabot reads this file from the default branch (main).
# The scientific libraries stay pinned on purpose: the committed numbers were produced with exactly
# these versions, so a bump is a deliberate change (re-run the pipeline, update the golden snapshot).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # No `uv` entry: uv.lock pins some libraries per platform (httpx and uvicorn differ on Windows with
  # Python 3.13), which Dependabot's uv updater cannot resolve, so its weekly job failed (18 Nov).
  # Library versions change only on purpose anyway (DECISIONS D14). Security alerts still cover them.

  - package-ecosystem: npm
    directory: /tests/ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

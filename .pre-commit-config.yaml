# pre-commit install   (once; then these run on every commit)
# pre-commit run --all-files
exclude: ^(\.claude/|site/|dist/|reports/|tests/golden/|tests/ui/node_modules/|uv\.lock|requirements(-dev)?\.txt)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5  # same Ruff as uv.lock
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=1500]
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: pyright
        name: pyright (basic, core modules)
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
